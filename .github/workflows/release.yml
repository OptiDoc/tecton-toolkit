name: plugin-release

on:
  workflow_call:
    inputs:
      project:
        description: Путь к csproj или sln, который нужно собрать
        required: true
        type: string
      tests:
        description: Путь к тестовому csproj или sln (пусто — тестов нет)
        required: false
        type: string
        default: ""
      description:
        description: Путь к описанию расширения (manifest.json)
        required: true
        type: string
      source:
        description: Каталог содержимого для архива (plugin/, i18n/, assets/ …)
        required: true
        type: string
      framework:
        description: Целевая среда для publish (net48, net8.0; пусто — все из проекта)
        required: false
        type: string
        default: ""
      toolkit-ref:
        description: Ветка или тег tecton-toolkit
        required: false
        type: string
        default: main
    secrets:
      publisher-key:
        description: Приватный ключ издателя (base64, 32 байта) для подписи архива
        required: true
      toolkit-token:
        description: Токен доступа к tecton-toolkit, если репозиторий приватный
        required: false

jobs:
  release:
    name: Pack, sign, GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout tecton-toolkit
        uses: actions/checkout@v4
        with:
          repository: OptiDoc/tecton-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit
          token: ${{ secrets.toolkit-token || github.token }}
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Пакет контракта из релизов ядра
        env:
          GH_TOKEN: ${{ secrets.toolkit-token || github.token }}
        run: |
          set -euo pipefail
          core_min=$(jq -r '.core_min' "${{ inputs.description }}")
          mkdir -p local-feed
          gh release download "v${core_min}" --repo OptiDoc/tecton \
            --pattern "Modules.Abstractions.${core_min}.nupkg" \
            --dir local-feed --clobber
      - name: Build
        run: dotnet build "${{ inputs.project }}" -c Release --nologo
      - name: Test
        if: ${{ inputs.tests != '' }}
        run: dotnet test "${{ inputs.tests }}" -c Release --nologo
      - name: Prepare content
        if: ${{ inputs.project != '' }}
        env:
          PROJECT: ${{ inputs.project }}
          SOURCE: ${{ inputs.source }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -euo pipefail
          args=(-c Release -o "$SOURCE/plugin")
          if [ -n "$FRAMEWORK" ]; then args+=(-f "$FRAMEWORK"); fi
          dotnet publish "$PROJECT" "${args[@]}"
          rm -rf "$SOURCE/i18n" "$SOURCE/assets"
          for d in i18n assets; do
            if [ -d "$d" ]; then cp -r "$d" "$SOURCE/"; fi
          done
      - name: Pack, sign, verify, release (тег = версия = имя архива)
        env:
          PUBLISHER_KEY: ${{ secrets.publisher-key }}
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          TESTS: ${{ inputs.tests }}
          DESC: ${{ inputs.description }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          ver=$(jq -r '.version' "$DESC")
          id=$(jq -r '.id' "$DESC")
          if [ "$expected" != "$ver" ]; then
            echo "Тег «$tag» не совпадает с версией описания «$ver»" >&2
            exit 1
          fi
          slug=$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]' | sed -E 's/-[0-9]+$//')
          name="${slug}-${ver}.zip"
          mkdir -p out
          dotnet run --project .toolkit/tools/PackageTool -c Release -- \
            pack --description "$DESC" --source "$SOURCE" --output "out/$name" | tee pack.log
          sha256=$(sed -n 's/^sha256=//p' pack.log)
          size=$(sed -n 's/^size=//p' pack.log)
          signature=$(dotnet run --project .toolkit/tools/PackageTool -c Release -- \
            sign --key "$PUBLISHER_KEY" --description "$DESC" --archive "out/$name")
          cp "$DESC" out/manifest.json
          dotnet run --project .toolkit/tools/PackageTool -c Release -- \
            stamp --description out/manifest.json --sha256 "$sha256" --size "$size" --signature "$signature"
          public_key=$(dotnet run --project .toolkit/tools/PackageTool -c Release -- \
            pub --key "$PUBLISHER_KEY")
          dotnet run --project .toolkit/tools/PackageTool -c Release -- \
            verify --description out/manifest.json --archive "out/$name" --public-key "$public_key"
          (cd out && sha256sum "$name" manifest.json > SHA256SUMS)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "out/$name" out/manifest.json out/SHA256SUMS --clobber
          else
            gh release create "$tag" "out/$name" out/manifest.json out/SHA256SUMS \
              --title "$tag" --generate-notes
          fi
